name: Deploy To Google Play

permissions:
  contents: write

concurrency:
  group: deploy-to-play-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  distribute:
    name: Distribute bundle to Google Play
    runs-on: ubuntu-latest

    env:
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore google-services.json from secret
        run: |
          echo "Restoring google-services.json for Android build (from secret)."
          mkdir -p app
          echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 --decode > app/google-services.json

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Cache Gradle files
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Version Bump
        uses: chkfung/android-version-actions@v1.2.3
        with:
          gradlePath: app/build.gradle.kts
          versionCode: ${{ github.run_number }}
          versionName: ${{ github.ref_name }}

      - name: Print Version Info
        shell: bash
        run: |
          echo "Planned versionName (from tag): ${{ github.ref_name }}"
          echo "Planned versionCode (from run): ${{ github.run_number }}"
          # Use environment variables set in previous step for version info
          echo "Resolved versionName (from env): ${VERSION_NAME:-${{ github.ref_name }}}"
          echo "Resolved versionCode (from env): ${VERSION_CODE:-${{ github.run_number }}}"
